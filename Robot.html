<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Robot Head</title>
<style>
:root{--bg1:#ececec;--bg2:#b9b9b9;--hint:#6b6b6b;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg1:#2a2a2c;--bg2:#101011;--hint:#8c8c8c}}
:root[data-theme="dark"]{--bg1:#2a2a2c;--bg2:#101011;--hint:#8c8c8c}
html,body{height:100%;margin:0}
body{background:radial-gradient(ellipse at 50% 40%,var(--bg1),var(--bg2));display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:system-ui,sans-serif;overflow:hidden;touch-action:none}
svg{width:min(94vw,900px);height:auto;max-height:80vh}
button{margin-top:10px;font:inherit;font-size:15px;padding:9px 22px;border-radius:999px;border:1px solid var(--hint);background:transparent;color:var(--hint);cursor:pointer}
button:focus-visible{outline:2px solid currentColor;outline-offset:3px}
p{color:var(--hint);font-size:14px;margin:8px 0 0}
</style>
</head>
<body>
<svg id="s" viewBox="0 0 800 500" aria-label="Animated robot head">
<defs>
<linearGradient id="steel" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#6a6a6c"/><stop offset=".5" stop-color="#46464a"/><stop offset="1" stop-color="#303033"/></linearGradient>
<linearGradient id="jaw" x1="0" y1="0" x2="0" y2="1">
<stop offset="0" stop-color="#58585b"/><stop offset=".6" stop-color="#3b3b3e"/><stop offset="1" stop-color="#242426"/></linearGradient>
<radialGradient id="glass" cx=".4" cy=".35" r=".8">
<stop offset="0" stop-color="#f4f4f4"/><stop offset=".6" stop-color="#bdbdbd"/><stop offset="1" stop-color="#7d7d7d"/></radialGradient>
<radialGradient id="iris" cx=".5" cy=".5" r=".5">
<stop offset="0" stop-color="#555"/><stop offset=".7" stop-color="#9a9a9a"/><stop offset="1" stop-color="#6c6c6c"/></radialGradient>
<clipPath id="cl"><circle cx="305" cy="185" r="46"/></clipPath>
<clipPath id="cr"><circle cx="495" cy="185" r="46"/></clipPath>
<clipPath id="hc"><path id="hp" d="M232 75C340 50 460 50 568 75C575 120 585 160 590 205L598 215V270H560L550 290H250L240 270H202V215L210 205C215 160 225 120 232 75Z"/></clipPath>
<filter id="sh" x="-20%" y="-20%" width="140%" height="160%"><feDropShadow dx="0" dy="28" stdDeviation="20" flood-opacity=".35"/></filter>
</defs>
<ellipse id="gs" cx="400" cy="470" rx="190" ry="14" fill="#000" opacity=".18"/>
<g id="head" filter="url(#sh)">
<path d="M206 262H594V400H206Z" fill="#050506"/>
<g id="jawg"><path d="M202 278H236L246 298H554L564 278H598V385Q400 425 202 385Z" fill="url(#jaw)"/>
<g id="jawl"></g></g>
<path d="M202 274H240L250 294H550L560 274H598" fill="none" stroke="#111" stroke-width="5"/>
<path d="M232 75C340 50 460 50 568 75C575 120 585 160 590 205L598 215V270H560L550 290H250L240 270H202V215L210 205C215 160 225 120 232 75Z" fill="url(#steel)"/>
<g clip-path="url(#hc)"><g id="scr"></g>
<path d="M232 75C340 50 460 50 568 75" fill="none" stroke="#9a9a9c" stroke-width="3" opacity=".6"/></g>
<rect x="468" y="96" width="44" height="26" rx="3" fill="#2c2c2f" stroke="#1a1a1c" stroke-width="3"/>
<circle cx="200" cy="245" r="14" fill="#2f2f32" stroke="#161618" stroke-width="3"/>
<circle cx="600" cy="245" r="14" fill="#2f2f32" stroke="#161618" stroke-width="3"/>
<g id="eyeL"><circle cx="305" cy="185" r="58" fill="#161618"/><circle cx="305" cy="185" r="52" fill="#3a3a3d"/><circle cx="305" cy="185" r="46" fill="url(#glass)"/>
<g clip-path="url(#cl)"><g class="iris"><circle r="24" fill="url(#iris)" stroke="#444" stroke-width="2"/><circle class="pu" r="8" fill="#0c0c0d"/></g>
<circle cx="288" cy="165" r="9" fill="#fff" opacity=".7"/>
<rect class="lid" x="250" y="125" width="110" height="120" fill="url(#steel)"/></g></g>
<g id="eyeR"><circle cx="495" cy="185" r="58" fill="#161618"/><circle cx="495" cy="185" r="52" fill="#3a3a3d"/><circle cx="495" cy="185" r="46" fill="url(#glass)"/>
<g clip-path="url(#cr)"><g class="iris"><circle r="24" fill="url(#iris)" stroke="#444" stroke-width="2"/><circle class="pu" r="8" fill="#0c0c0d"/></g>
<circle cx="478" cy="165" r="9" fill="#fff" opacity=".7"/>
<rect class="lid" x="440" y="125" width="110" height="120" fill="url(#steel)"/></g></g>
</g>
</svg>
<p>Move your pointer. Click or tap to startle it.</p>
<button id="talk" type="button">Make it talk</button>
<script>
(function(){
var NS="http://www.w3.org/2000/svg",$=function(i){return document.getElementById(i)};
var jaw=$("jawg"),mouth=0,speakUntil=0,btn=$("talk"),head=$("head"),jawl=$("jawl"),scr=$("scr"),gs=$("gs");
var irises=[].slice.call(document.querySelectorAll(".iris")),pus=[].slice.call(document.querySelectorAll(".pu")),lids=[].slice.call(document.querySelectorAll(".lid"));
var eyes=[[305,185],[495,185]];
var reduce=matchMedia("(prefers-reduced-motion: reduce)").matches;
function line(p,x,y,l,a,o){var e=document.createElementNS(NS,"line");e.setAttribute("x1",x);e.setAttribute("y1",y);e.setAttribute("x2",x+l*Math.cos(a));e.setAttribute("y2",y+l*Math.sin(a));e.setAttribute("stroke","#d0d0d2");e.setAttribute("stroke-width",.8);e.setAttribute("opacity",o);p.appendChild(e)}
for(var i=0;i<70;i++)line(scr,230+Math.random()*370,70+Math.random()*210,8+Math.random()*28,-.9+Math.random()*1.8+(Math.random()<.3?1.5:0),.1+Math.random()*.25);
for(var j=0;j<26;j++)line(jawl,205+Math.random()*390,300+Math.random()*90,10+Math.random()*30,-.4+Math.random()*.8,.08+Math.random()*.2);
var tx=0,ty=0,cx=0,cy=0,last=performance.now(),idleAt=0,nextBlink=1500,blink=0,blinkT=-1,startle=0,jolt=0;
function aim(e){var r=$("s").getBoundingClientRect();tx=((e.clientX-r.left)/r.width-.5)*2;ty=((e.clientY-r.top)/r.height-.5)*2;tx=Math.max(-1.6,Math.min(1.6,tx));ty=Math.max(-1.6,Math.min(1.6,ty));idleAt=performance.now()+3000}
addEventListener("pointermove",aim);btn.addEventListener("pointerdown",function(e){e.stopPropagation()});
function talk(){speakUntil=performance.now()+3600;try{var u=new SpeechSynthesisUtterance("Hello! I am a robot. Nice to meet you.");u.pitch=.6;u.rate=.95;u.onend=function(){speakUntil=0};speechSynthesis.cancel();speechSynthesis.speak(u)}catch(e){}}
btn.addEventListener("click",talk);addEventListener("keydown",function(e){if(e.code==="Space"){e.preventDefault();talk()}});
addEventListener("pointerdown",function(e){aim(e);startle=1;jolt=1;blinkT=-1});
function frame(t){
var dt=Math.min(50,t-last);last=t;
if(t>idleAt&&t>(frame.g||0)){tx=(Math.random()-.5)*1.8;ty=(Math.random()-.5)*1.2;frame.g=t+1200+Math.random()*1800}
var k=1-Math.pow(.0015,dt/1000);
cx+=(tx-cx)*k;cy+=(ty-cy)*k;
startle=Math.max(0,startle-dt/900);jolt=Math.max(0,jolt-dt/500);
if(blinkT<0&&t>nextBlink&&!startle){blinkT=0}
if(blinkT>=0){blinkT+=dt;var p=blinkT/220;blink=p<.5?p*2:Math.max(0,2-p*2);if(p>=1){blink=0;blinkT=-1;nextBlink=t+1800+Math.random()*3500;if(Math.random()<.2)nextBlink=t+250}}
var open=t<speakUntil?.25+.75*Math.abs(Math.sin(t/85)*Math.sin(t/210+1)):startle*.7;
mouth+=(open-mouth)*(1-Math.pow(.0001,dt/1000));
jaw.setAttribute("transform","translate(0 "+(mouth*30).toFixed(2)+")");
var bob=reduce?0:Math.sin(t/900)*7,sway=reduce?0:Math.sin(t/1700)*1.2;
var shake=Math.sin(t/25)*jolt*5;
var rot=cx*4+sway+shake*.3+(t<speakUntil?Math.sin(t/160)*.8:0),dx=cx*14+shake,dy=cy*8+bob-jolt*8;
head.setAttribute("transform","translate("+dx.toFixed(2)+" "+dy.toFixed(2)+") rotate("+rot.toFixed(2)+" 400 250)");
gs.setAttribute("rx",190-bob*1.5-jolt*10);gs.setAttribute("opacity",(.18-bob*.004).toFixed(3));
var s=1+startle*.12;
for(var i=0;i<2;i++){
var ex=cx*22,ey=cy*18;
irises[i].setAttribute("transform","translate("+(eyes[i][0]+ex)+" "+(eyes[i][1]+ey)+")");
pus[i].setAttribute("transform","translate("+(cx*5)+" "+(cy*4)+") scale("+(s*(1-startle*.45))+")");
lids[i].setAttribute("y",(blink*125-10).toFixed(1));
}
requestAnimationFrame(frame)}
requestAnimationFrame(frame);
})();
</script>
</body>
</html>
